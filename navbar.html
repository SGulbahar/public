<nav class="navbar">
  <div style="flex:1">
    <div class="nb-page-title">{% block page_title %}{{ page_title | default('Dashboard') }}{% endblock %}</div>
    <div class="nb-breadcrumb">
      Lumen AIOps
      {% if breadcrumb %}
        {% for crumb in breadcrumb %}
          / {{ crumb }}
        {% endfor %}
      {% endif %}
    </div>
  </div>

  <div class="nb-right">
    <!-- Engine status -->
    <div class="nb-status">
      <div class="nb-dot" style="background:{{ '#28a745' if engine_online else '#dc3545' }}"></div>
      Engine {{ 'Online' if engine_online else 'Offline' }}
    </div>

    <!-- Neo4j status -->
    <div class="nb-status">
      <div class="nb-dot" style="background:{{ '#17a2b8' if neo4j_online else '#dc3545' }}"></div>
      Neo4j
    </div>

    <!-- Zabbix status -->
    <div class="nb-status">
      <div class="nb-dot" style="background:{{ '#28a745' if zabbix_online else '#dc3545' }}"></div>
      Zabbix
    </div>

    <!-- Time filter -->
    <button class="nb-btn" id="time-filter-btn">
      {{ time_filter | default('Son 24 Saat') }} ▾
    </button>

    <!-- Theme toggle -->
    <button class="theme-toggle" id="theme-toggle-btn" title="Tema değiştir">
      <svg id="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
        <circle cx="8" cy="8" r="3"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M12.7 3.3l-1.4 1.4M5.1 10.9l-1.4 1.4"/>
      </svg>
      <svg id="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13.5 10A6 6 0 016 2.5a6 6 0 100 11 6 6 0 007.5-3.5z"/>
      </svg>
    </button>

    <!-- User -->
    <div class="nb-status" style="cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="8" cy="6" r="3"/>
        <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      </svg>
      {{ current_user | default('Admin') }}
    </div>
  </div>
</nav>
