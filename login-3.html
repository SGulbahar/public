<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen AIOps — Giriş</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306091a'/%3E%3Cline x1='32' y1='48' x2='6' y2='10' stroke='%23818cf8' stroke-width='1.2' opacity='.4'/%3E%3Cline x1='32' y1='48' x2='14' y2='6' stroke='%234d7cfe' stroke-width='1.5' opacity='.55'/%3E%3Cline x1='32' y1='48' x2='22' y2='4' stroke='%2338bdf8' stroke-width='1.8' opacity='.65'/%3E%3Cline x1='32' y1='48' x2='32' y2='4' stroke='%23e0f2fe' stroke-width='2.5' opacity='.85'/%3E%3Cline x1='32' y1='48' x2='42' y2='4' stroke='%2338bdf8' stroke-width='1.8' opacity='.65'/%3E%3Cline x1='32' y1='48' x2='50' y2='6' stroke='%234d7cfe' stroke-width='1.5' opacity='.55'/%3E%3Cline x1='32' y1='48' x2='58' y2='10' stroke='%23818cf8' stroke-width='1.2' opacity='.4'/%3E%3Cline x1='10' y1='48' x2='54' y2='48' stroke='%234d7cfe' stroke-width='1' opacity='.3'/%3E%3Ccircle cx='32' cy='48' r='3' fill='%23e0f2fe'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'Source Sans Pro', -apple-system, sans-serif;
  --blue: #4d7cfe;
  --red: #ef4444;
}

body {
  font-family: var(--font);
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050810;
  color: #e2e8f0;
  overflow: hidden;
}

/* ── Neural Network Background ── */
#neural-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* Köşe HUD elemanları */
.hud {
  position: fixed;
  z-index: 2;
  font-size: 9px;
  font-family: 'Courier New', monospace;
  color: rgba(77,124,254,.45);
  letter-spacing: .06em;
  pointer-events: none;
}
.hud-tl { top: 16px; left: 16px; }
.hud-tr { top: 16px; right: 16px; text-align: right; }
.hud-bl { bottom: 16px; left: 16px; }
.hud-br { bottom: 16px; right: 16px; text-align: right; }
.hud div { margin-bottom: 3px; }
.hud .hud-val { color: rgba(99,179,237,.7); }

/* Pulse ring arkada */
.pulse-ring {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  border-radius: 50%;
  border: 1px solid rgba(77,124,254,.06);
  z-index: 1;
  pointer-events: none;
  animation: pulse-ring 4s ease-out infinite;
}
.pulse-ring:nth-child(2) { width: 400px; height: 400px; animation-delay: 1.3s; }
.pulse-ring:nth-child(3) { width: 800px; height: 800px; animation-delay: 2.6s; }
@keyframes pulse-ring {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(.8); }
  30%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.1); }
}

/* ── Login kutusu ── */
.login-wrap {
  position: relative;
  z-index: 10;
  width: 380px;
  padding: 20px;
}

.brand {
  text-align: center;
  margin-bottom: 28px;
}
.brand-icon {
  width: 56px; height: 56px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  box-shadow: 0 0 40px rgba(77,124,254,.3), 0 4px 24px rgba(0,0,0,.5);
  overflow: hidden;
}
.brand-name {
  font-size: 24px; font-weight: 700;
  color: #e2e8f0; letter-spacing: -.02em;
}
.brand-sub {
  font-size: 12px; color: #64748b; margin-top: 4px;
}

/* Glassmorphism kart */
.card {
  background: rgba(10, 14, 28, 0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 14px;
  border: 1px solid rgba(77,124,254,.2);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 8px 40px rgba(0,0,0,.5),
    0 0 80px rgba(77,124,254,.07);
  padding: 28px;
}

.card-title {
  font-size: 16px; font-weight: 600;
  color: #e2e8f0; margin-bottom: 18px;
}

/* LDAP badge */
.auth-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; padding: 3px 9px; border-radius: 4px;
  background: rgba(77,124,254,.12);
  border: 1px solid rgba(77,124,254,.25);
  color: #7aa4fe;
  margin-bottom: 18px;
  letter-spacing: .02em;
}

/* Hata kutusu */
.error-box {
  display: none;
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.4);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: #fca5a5;
  margin-bottom: 16px;
}

/* Form alanları */
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  color: #64748b; margin-bottom: 6px;
  letter-spacing: .04em; text-transform: uppercase;
}
.field input {
  width: 100%; padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 7px;
  background: rgba(255,255,255,.05);
  color: #e2e8f0;
  font-size: 14px; font-family: var(--font);
  transition: border-color .15s, box-shadow .15s, background .15s;
  outline: none;
}
.field input:focus {
  border-color: rgba(77,124,254,.6);
  background: rgba(77,124,254,.07);
  box-shadow: 0 0 0 3px rgba(77,124,254,.15);
}
.field input::placeholder { color: #334155; }

/* Giriş butonu */
.btn-login {
  width: 100%; padding: 11px;
  background: linear-gradient(135deg, #4d7cfe, #2563eb);
  color: #fff; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: var(--font);
  transition: opacity .12s, box-shadow .15s;
  margin-top: 6px;
  box-shadow: 0 4px 20px rgba(77,124,254,.35);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:hover {
  opacity: .92;
  box-shadow: 0 6px 28px rgba(77,124,254,.5);
}
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

/* Spinner */
.spinner {
  display: none;
  width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.footer {
  text-align: center; margin-top: 18px;
  font-size: 11px; color: #1e2d47;
}

/* Tema butonu */
.theme-btn {
  position: fixed; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(10,14,28,.7);
  backdrop-filter: blur(8px);
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  color: #64748b; font-size: 14px; z-index: 20;
}

/* Light mode override — sadece tema butonu ile açılır */
[data-theme="light"] body { background: #e8ecf5; color: #1e293b; }
[data-theme="light"] #neural-canvas { opacity: .35; filter: invert(1) hue-rotate(180deg); }
[data-theme="light"] .card {
  background: rgba(255,255,255,.8);
  border-color: rgba(77,124,254,.25);
}
[data-theme="light"] .card-title { color: #1e293b; }
[data-theme="light"] .field input {
  background: rgba(255,255,255,.9);
  border-color: #cbd5e1; color: #1e293b;
}
[data-theme="light"] .field input:focus {
  background: #fff;
  border-color: #4d7cfe;
}
[data-theme="light"] .field input::placeholder { color: #94a3b8; }
[data-theme="light"] .field label { color: #64748b; }
[data-theme="light"] .brand-name { color: #1e293b; }
[data-theme="light"] .brand-sub  { color: #94a3b8; }
[data-theme="light"] .footer { color: #94a3b8; }
[data-theme="light"] .hud { color: rgba(77,124,254,.35); }
[data-theme="light"] .theme-btn { background: rgba(255,255,255,.8); border-color: #e2e8f0; }
</style>
</head>
<body>

<!-- Neural canvas -->
<canvas id="neural-canvas"></canvas>

<!-- Pulse rings -->
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>

<!-- HUD köşe bilgileri -->
<div class="hud hud-tl">
  <div>LUMEN-AIOPS <span class="hud-val">v1.0α</span></div>
  <div>STATUS <span class="hud-val">ONLINE</span></div>
  <div>NODES <span class="hud-val" id="hud-nodes">--</span></div>
</div>
<div class="hud hud-tr">
  <div>FIBABANKA SRE</div>
  <div>ENV <span class="hud-val">PROD</span></div>
  <div id="hud-time" class="hud-val">--:--:--</div>
</div>
<div class="hud hud-bl">
  <div>AUTH <span class="hud-val">LDAP+LOCAL</span></div>
  <div>TLS <span class="hud-val">1.3 ✓</span></div>
</div>
<div class="hud hud-br">
  <div>ANOMALY <span class="hud-val" id="hud-anomaly">--</span></div>
  <div>UPTIME <span class="hud-val">99.8%</span></div>
</div>

<!-- Tema butonu -->
<button class="theme-btn" onclick="toggleTheme()" title="Tema değiştir">🌙</button>

<!-- Login kutusu -->
<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#06091a"/>
        <defs>
          <filter id="lumen-glow">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 7 ışın huzmesi -->
        <line x1="32" y1="48" x2="6"  y2="10" stroke="#818cf8" stroke-width="1.2" opacity=".4"/>
        <line x1="32" y1="48" x2="14" y2="6"  stroke="#4d7cfe" stroke-width="1.5" opacity=".55"/>
        <line x1="32" y1="48" x2="22" y2="4"  stroke="#38bdf8" stroke-width="1.8" opacity=".65"/>
        <line x1="32" y1="48" x2="32" y2="4"  stroke="#e0f2fe" stroke-width="2.5" opacity=".9" filter="url(#lumen-glow)"/>
        <line x1="32" y1="48" x2="42" y2="4"  stroke="#38bdf8" stroke-width="1.8" opacity=".65"/>
        <line x1="32" y1="48" x2="50" y2="6"  stroke="#4d7cfe" stroke-width="1.5" opacity=".55"/>
        <line x1="32" y1="48" x2="58" y2="10" stroke="#818cf8" stroke-width="1.2" opacity=".4"/>
        <!-- Ufuk çizgisi -->
        <line x1="10" y1="48" x2="54" y2="48" stroke="#4d7cfe" stroke-width="1" opacity=".35"/>
        <!-- Kaynak noktası -->
        <circle cx="32" cy="48" r="4" fill="#38bdf8" opacity=".2" filter="url(#lumen-glow)"/>
        <circle cx="32" cy="48" r="2.2" fill="#e0f2fe" filter="url(#lumen-glow)"/>
      </svg>
    </div>
    <div class="brand-name">Lumen AIOps</div>
    <div class="brand-sub">Fibabanka SRE Platform · v1.0 Alpha</div>
  </div>

  <div class="card">
    <div class="card-title">Giriş Yap</div>

    <div class="auth-badge">
      🏢 LDAP + Yerel Kimlik Doğrulama
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="field">
      <label>Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="kullaniciadi" autocomplete="username" autofocus>
    </div>

    <div class="field">
      <label>Parola</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <span id="btn-text">Giriş Yap</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <div class="footer">
    Fibabanka A.Ş. · SRE Operations · {{ current_year | default(2026) }}
  </div>
</div>

<script>
// ── Neural Network Canvas ──────────────────────────────────────
const canvas = document.getElementById('neural-canvas');
const ctx    = canvas.getContext('2d');
let W, H, pts = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initPts() {
  const count = Math.min(80, Math.floor((W * H) / 12000));
  pts = Array.from({ length: count }, () => ({
    x:  Math.random() * W,
    y:  Math.random() * H,
    vx: (Math.random() - .5) * .5,
    vy: (Math.random() - .5) * .5,
    r:  Math.random() * 1.8 + .8,
    pulse: Math.random() * Math.PI * 2
  }));
  document.getElementById('hud-nodes').textContent = count;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const T = Date.now() / 1000;
  const MAX_DIST = 140;

  // Bağlantı çizgileri
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x;
      const dy = pts[i].y - pts[j].y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < MAX_DIST) {
        const alpha = (1 - d / MAX_DIST) * .35;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(77,124,254,${alpha})`;
        ctx.lineWidth = .8;
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.stroke();
      }
    }
  }

  // Noktalar
  pts.forEach(p => {
    const pulse = Math.sin(T * 1.5 + p.pulse) * .4 + .8;
    const r = p.r * pulse;

    // Dış hale
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 5);
    grd.addColorStop(0, `rgba(99,179,237,${.25 * pulse})`);
    grd.addColorStop(1, 'rgba(99,179,237,0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 5, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Merkez nokta
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(99,179,237,${.75 * pulse})`;
    ctx.fill();

    // Hareket
    p.x += p.vx; p.y += p.vy;
    if (p.x < -20 || p.x > W + 20) p.vx *= -1;
    if (p.y < -20 || p.y > H + 20) p.vy *= -1;
  });

  requestAnimationFrame(draw);
}

resize();
initPts();
draw();
window.addEventListener('resize', () => { resize(); initPts(); });

// HUD saat
function updateClock() {
  const now = new Date();
  document.getElementById('hud-time').textContent =
    now.toTimeString().slice(0, 8);
}
updateClock();
setInterval(updateClock, 1000);

// HUD anomaly sayacı (simüle)
let anomalyBase = Math.floor(Math.random() * 20) + 5;
document.getElementById('hud-anomaly').textContent = anomalyBase;
setInterval(() => {
  if (Math.random() < .15) {
    anomalyBase += Math.random() < .5 ? 1 : -1;
    anomalyBase = Math.max(0, anomalyBase);
    document.getElementById('hud-anomaly').textContent = anomalyBase;
  }
}, 3000);

// ── Tema ──────────────────────────────────────────────────────
var THEME_KEY = 'lumen-theme';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('.theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

// ── Enter ile giriş ───────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── Login ─────────────────────────────────────────────────────
function doLogin() {
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var btn      = document.getElementById('login-btn');
  var spinner  = document.getElementById('spinner');
  var btnText  = document.getElementById('btn-text');
  var errorBox = document.getElementById('error-box');

  if (!username || !password) {
    showError('Kullanıcı adı ve parola gereklidir.');
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.style.display = 'none';
  errorBox.style.display = 'none';

  var form = new FormData();
  form.append('username', username);
  form.append('password', password);

  fetch('/auth/login', {
    method: 'POST',
    body: form
  })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Giriş başarısız'); });
    return r.json();
  })
  .then(function(data) {
    if (data.access_token) {
      localStorage.setItem('lumen_token', data.access_token);
      localStorage.setItem('lumen_user', username);
      var secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = 'access_token=' + data.access_token + '; path=/; SameSite=Lax' + secure;
    }
    window.location.href = '/dashboard';
  })
  .catch(function(e) {
    showError(e.message || 'Kullanıcı adı veya parola hatalı.');
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.style.display = 'block';
  });
}

function showError(msg) {
  var box = document.getElementById('error-box');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}

// Zaten giriş yapılmışsa yönlendir
if (localStorage.getItem('lumen_token')) {
  fetch('/auth/me', {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('lumen_token') }
  })
  .then(function(r) { if (r.ok) window.location.href = '/dashboard'; })
  .catch(function() {});
}
</script>
</body>
</html>
